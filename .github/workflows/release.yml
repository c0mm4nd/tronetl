name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN_NAME=tronetl
          SUFFIX=""
          if [ "$GOOS" = "windows" ]; then SUFFIX=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN_NAME}-${GOOS}-${GOARCH}${SUFFIX}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tronetl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Set release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Release ${GITHUB_REF_NAME}"
            PRE=false
            LATEST=true
          else
            TAG="push-${GITHUB_SHA::7}"
            NAME="Push build ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
            PRE=true
            LATEST=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${LATEST}" >> "$GITHUB_OUTPUT"
      - name: Create tag (non-tag push)
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PAT: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then echo 'Missing RELEASE_TOKEN secret with repo scope' && exit 1; fi
          git config user.name 'release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git tag "$TAG" || true
          git push https://$PAT@github.com/${{ github.repository }} "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
